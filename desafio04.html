<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <script src="resources/script/desafio4.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>

        <form id="formIMC">

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70" step="any" required>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex: 1.75" step="any" required>

            <button type="submit">Calcular IMC</button>

        </form>

        <p id="resultado"></p>
    </div>

</body>
</html>
